name: voiceagent

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: voiceagent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-voiceagent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - voiceagent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-voiceagent}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: voiceagent_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - voiceagent
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voiceagent_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3011:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - voiceagent
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_DEFAULT_API_KEY: ${API_KEY}
    container_name: voiceagent_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3010:3000"
    networks:
      - voiceagent
    depends_on:
      backend:
        condition: service_started

networks:
  voiceagent:
    name: voiceagent_net

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
